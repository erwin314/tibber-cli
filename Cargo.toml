[package]
name = "tibber-cli"
version = "0.1.0"
edition = "2024"
description = "Tibber CLI tool"
license = "Apache-2.0"
repository = "https://github.com/erwin314/tibber-cli"
readme = "README.md"
keywords = ["tibber", "energy", "cli", "price"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ureq = { version = "3.3.0", features = ["json"] }

[lints.clippy]
pedantic = "deny"

[lints.rust]
missing_docs = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 3
